[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "projet-mlops"
version = "0.1.0"
description = "MLOps: EDA, API FastAPI, tests, CI/CD"
authors = [{name = "Ksenia Dautel"}]
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2",
  "scikit-learn>=1.3",
  "uvicorn[standard]>=0.38",
  "joblib>=1.4",
  "pydantic>=2.8",
  "httpx>=0.28.1",
  "fastapi>=0.128.6",
  "xgboost>=3.1.3",
]

[dependency-groups]
dev = [
  "pytest>=9.0.1",
  "pytest-cov>=5.0.0",
  "jupyter>=1.1.1",
  "ipykernel>=6.29.5",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.3.2",
  "evidently>=0.7.20",
  "streamlit>=1.54.0",
]
[tool.hatch.build.targets.wheel]
packages = ["src/app"]

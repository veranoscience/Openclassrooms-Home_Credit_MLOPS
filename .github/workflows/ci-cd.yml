name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
       
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install deps (incl. dev)
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: home-credit-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --rm -p 8000:8000 --name api home-credit-api:ci
          for i in {1..20}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "API OK"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health
          docker stop api

  deploy-hf-space:
    runs-on: ubuntu-latest
    needs: [tests, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install deps (git-lfs, curl, unzip, rsync)
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs curl unzip rsync
          git lfs install

      - name: Install git-xet
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/huggingface/xet-core/refs/heads/main/git_xet/install.sh | sh
          git xet --version
          git xet install

      - name: Push to Hugging Face Space (clean repo + xet)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
         set -euxo pipefail

          # 1) Construire un repo "clean" (sans historique GitHub)
          rm -rf hf_space_repo
          mkdir hf_space_repo
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            ./ hf_space_repo/

          cd hf_space_repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2) tracker les binaires AVANT git add (sinon HF refuse)
          git lfs install
          git lfs track "*.pkl"
          git add .gitattributes

          # 3) Commit + push
          git add .
          git commit -m "Deploy Space"
          git branch -M main
          git remote add space "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"
          git push --force space main